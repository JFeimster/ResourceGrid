name: Materialize hosting master JSON

on:
  push:
    paths:
      - ".github/workflows/materialize-hosting-json.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize hosting registry files
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, pathlib

          files = {
            "registries/hosting/hosting-options.master.json": "",
            "registries/hosting/repo-deployment-matrix.master.json": "",
          }

          for path, payload in files.items():
              target = pathlib.Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          rm .github/workflows/materialize-hosting-json.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add hosting deployment master registries"
          git push
