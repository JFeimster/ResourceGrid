name: Materialize hosting master JSON retry

on:
  push:
    paths:
      - ".github/workflows/materialize-hosting-json-retry.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize and validate hosting registry files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p registries/hosting
          cat $(find .tmp/hosting-materialize -maxdepth 1 -name 'hosting.part*.b64' | sort) | base64 --decode > registries/hosting/hosting-options.master.json
          cat $(find .tmp/hosting-materialize -maxdepth 1 -name 'matrix.part*.b64' | sort) | base64 --decode > registries/hosting/repo-deployment-matrix.master.json
          python -m json.tool registries/hosting/hosting-options.master.json >/dev/null
          python -m json.tool registries/hosting/repo-deployment-matrix.master.json >/dev/null
          echo "30026904e2548d067babb35a16519394244ca9b18e13985c70b7f508f15019be  registries/hosting/hosting-options.master.json" | sha256sum -c -
          echo "cb4fbd5c9e1c18462e830a3c4027484db17e339cc36497fccd9bf23d7d5aa412  registries/hosting/repo-deployment-matrix.master.json" | sha256sum -c -
          rm -rf .tmp/hosting-materialize
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add hosting deployment master registries"
          git push
