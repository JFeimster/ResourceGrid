name: Update FundStack Cloudflare registry state

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-fundstack-cloudflare.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update canonical FundStack hosting records
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          sites_path = Path('registries/resources/sites.json')
          sites = json.loads(sites_path.read_text(encoding='utf-8'))
          site_records = sites.get('items') or sites.get('resources') or sites.get('sites') or sites
          updated_site = False
          if isinstance(site_records, list):
              for item in site_records:
                  if item.get('resource_id') == 'site-fundstack-ai' or (item.get('title') == 'fundstack-ai' and item.get('canonical_url') == 'https://fundstack-ai.vercel.app/'):
                      item['canonical_url'] = 'https://fundstack.distilledfunding.com/'
                      item['public_url'] = 'https://fundstack.distilledfunding.com/'
                      updated_site = True
          if not updated_site:
              raise SystemExit('FundStack site record not found')
          sites_path.write_text(json.dumps(sites, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          matrix_path = Path('registries/hosting/repo-deployment-matrix.master.json')
          matrix = json.loads(matrix_path.read_text(encoding='utf-8'))
          updated_matrix = False
          for project in matrix.get('projects', []):
              if project.get('repo_id') == 'github:JFeimster/FundStack-AI':
                  project['current_deployment'] = {
                      'provider': 'Cloudflare',
                      'project': 'fundstack-ai',
                      'project_id': None,
                      'url': 'https://fundstack-ai.pages.dev',
                      'domains': ['fundstack.distilledfunding.com'],
                      'status_note': 'Canonical production moved to Cloudflare Pages with Wix-managed CNAME. Legacy Vercel projects fundstack-ai (prj_Zpxy4N07U73b2kGBCGjtN5ubmVFa) and fund-stack-ai (prj_WCbfAbh3RcCopMfUIWfwE7xrC4nW) are non-canonical retirement/history only.'
                  }
                  updated_matrix = True
                  break
          if not updated_matrix:
              raise SystemExit('FundStack deployment matrix record not found')
          matrix_path.write_text(json.dumps(matrix, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

          python -m json.tool registries/resources/sites.json >/dev/null
          python -m json.tool registries/hosting/repo-deployment-matrix.master.json >/dev/null
          rm .github/workflows/update-fundstack-cloudflare.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record FundStack Cloudflare Pages migration"
          git push
